<ui-stat b-hydrate b-id="ui-stat">
  <template shadowrootmode="open">
    <style>:host {
    display: block;
  }

  .stat {
    padding: 1rem 1.2rem;
    border-radius: 12px;
    background: #f7f9fc;
    color: #2b3245;
  }

  .stat__label {
    margin: 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7a839b;
  }

  .stat__value {
    margin: 0.25rem 0 0;
    font-size: 1.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .stat__delta {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
  }

  .stat__delta--up {
    color: #1c7a4a;
  }

  .stat__delta--down {
    color: #b03030;
  }</style>
    <div class="stat">
      <p class="stat__label">Sessions</p>
      <p class="stat__value">138</p>
      <p class="stat__delta stat__delta--up">+0% this week</p>
    </div>
  </template>
</ui-stat>
