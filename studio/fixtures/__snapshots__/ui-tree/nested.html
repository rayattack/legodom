<ui-tree b-hydrate b-id="ui-tree">
  <template shadowrootmode="open">
    <style>:host {
    display: block;
  }

  .tree__label {
    margin: 0;
    padding: 0.2rem 0;
    font-weight: 600;
  }

  .tree__children {
    margin: 0;
    padding: 0 0 0 1rem;
    list-style: none;
    border-left: 1px solid #e4e8f0;
  }

  .tree__child {
    padding-left: 0.4rem;
  }</style>
    <div class="tree">
      <p class="tree__label">studio</p>
      <ul b-if="depth < 3 && node.children && node.children.length > 0" class="tree__children">
        <!--b-for: child in node.children-->
        <li b-for="child in node.children" b-key="label" class="tree__child" data-b-key="src">
          <ui-tree :node="child" :depth="depth + 1" b-hydrate b-id="ui-tree">
            <template shadowrootmode="open">
              <style>:host {
    display: block;
  }

  .tree__label {
    margin: 0;
    padding: 0.2rem 0;
    font-weight: 600;
  }

  .tree__children {
    margin: 0;
    padding: 0 0 0 1rem;
    list-style: none;
    border-left: 1px solid #e4e8f0;
  }

  .tree__child {
    padding-left: 0.4rem;
  }</style>
              <div class="tree">
                <p class="tree__label">src</p>
                <ul b-if="depth < 3 && node.children && node.children.length > 0" class="tree__children">
                  <!--b-for: child in node.children-->
                  <li b-for="child in node.children" b-key="label" class="tree__child" data-b-key="core">
                    <ui-tree :node="child" :depth="depth + 1" b-hydrate b-id="ui-tree">
                      <template shadowrootmode="open">
                        <style>:host {
    display: block;
  }

  .tree__label {
    margin: 0;
    padding: 0.2rem 0;
    font-weight: 600;
  }

  .tree__children {
    margin: 0;
    padding: 0 0 0 1rem;
    list-style: none;
    border-left: 1px solid #e4e8f0;
  }

  .tree__child {
    padding-left: 0.4rem;
  }</style>
                        <div class="tree">
                          <p class="tree__label">core</p>
                          <!--b-if: depth < 3 && node.children && node.children.length > 0-->
                        </div>
                      </template>
                    </ui-tree>
                  </li>
                </ul>
              </div>
            </template>
          </ui-tree>
        </li>
        <li b-for="child in node.children" b-key="label" class="tree__child" data-b-key="fixtures">
          <ui-tree :node="child" :depth="depth + 1" b-hydrate b-id="ui-tree">
            <template shadowrootmode="open">
              <style>:host {
    display: block;
  }

  .tree__label {
    margin: 0;
    padding: 0.2rem 0;
    font-weight: 600;
  }

  .tree__children {
    margin: 0;
    padding: 0 0 0 1rem;
    list-style: none;
    border-left: 1px solid #e4e8f0;
  }

  .tree__child {
    padding-left: 0.4rem;
  }</style>
              <div class="tree">
                <p class="tree__label">fixtures</p>
                <!--b-if: depth < 3 && node.children && node.children.length > 0-->
              </div>
            </template>
          </ui-tree>
        </li>
      </ul>
    </div>
  </template>
</ui-tree>
