<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegoDOM</title>
    <meta name="description" content="Reactive web components with no imports, no virtual DOM and no required build step." />
    <link rel="icon" type="image/svg+xml" href="/legodom/logo.svg" />
    <script>
      // Set the colour scheme before first paint. The key is written by $db
      // in site-header.lego, which stores JSON.
      try {
        var saved = JSON.parse(localStorage.getItem('legodom.theme') || '"auto"');
        var dark = saved === 'dark' || (saved === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <site-header></site-header>
    <div class="site-body">
      <docs-sidebar></docs-sidebar>
      <lego-router><!--prerender--></lego-router>
    </div>
    <site-search></site-search>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
